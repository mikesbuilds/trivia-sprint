name: Refill question bank

# Safety net. Pulls from free, key-less trivia APIs whenever a category drops
# below the threshold, so the app cannot run dry unattended. Curated questions
# are always drawn first, so this only surfaces once the good stock is spent.

on:
  schedule:
    - cron: "40 8 * * 1"  # Mondays, before the daily publish run
  workflow_dispatch:
    inputs:
      min_per_category:
        description: "Refill any category below this depth"
        required: false
        default: "60"

permissions:
  contents: write

concurrency:
  group: publish-trivia   # shared with publish.yml; both write bank/
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refill bank
        run: python3 tools/refill.py --min-per-category "${{ inputs.min_per_category || 60 }}"

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refill question bank $(date -u +%Y-%m-%d)"
          git push
